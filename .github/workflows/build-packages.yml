name: Build Windows and Ubuntu Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            bundles: nsis
            artifact-path: |
              src-tauri/target/release/cc-switch.exe
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04-amd64
            os: ubuntu-22.04
            bundles: deb
            artifact-path: src-tauri/target/release/bundle/deb/*.deb

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: packages-${{ runner.os }}-rust-1.95-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            packages-${{ runner.os }}-rust-1.95-

      - name: Install Ubuntu 22.04 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for unsigned fork builds
        run: |
          node -e "require('node:fs').writeFileSync('src-tauri/tauri.ci.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Build application and package
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json

      - name: Inspect Debian package
        if: runner.os == 'Linux'
        run: dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
